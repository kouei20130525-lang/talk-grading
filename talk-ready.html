<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talk Ready | TALK BATTLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F9FB; --surface:#FFFFFF; --ink:#16283F; --muted:#5B6B80;
  --line:#DCE3EC; --accent:#1F4E79; --accent-ink:#FFFFFF;
  --mark:#FFE066; --mark-ink:#16283F; --step:#C9D6E5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A28; --surface:#172536; --ink:#E8EEF5; --muted:#9DB0C6;
    --line:#2A3D54; --accent:#7FB3E6; --accent-ink:#0F1A28;
    --mark:#8A7414; --mark-ink:#FFF6CC; --step:#2F4560;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A28; --surface:#172536; --ink:#E8EEF5; --muted:#9DB0C6;
  --line:#2A3D54; --accent:#7FB3E6; --accent-ink:#0F1A28;
  --mark:#8A7414; --mark-ink:#FFF6CC; --step:#2F4560;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:28px 18px 48px}
h1{font-family:"Lexend",system-ui,sans-serif;font-weight:700;font-size:2.4rem;letter-spacing:-0.02em;margin:0;line-height:1.1}
.lead{color:var(--muted);margin:6px 0 28px;font-size:.95rem}
h2{font-size:1rem;font-weight:700;margin:0 0 12px}
section{margin-bottom:28px}
.themes{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.9rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  padding:6px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.stairs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:128px}
.stair{font-family:"Lexend",system-ui,sans-serif;font-weight:700;font-size:1rem;border:none;cursor:pointer;
  background:var(--step);color:var(--ink);border-radius:8px 8px 3px 3px;display:flex;align-items:flex-start;
  justify-content:center;padding-top:8px;transition:background .15s}
.stair[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stair:nth-child(1){height:34%}.stair:nth-child(2){height:47%}.stair:nth-child(3){height:60%}
.stair:nth-child(4){height:73%}.stair:nth-child(5){height:86%}.stair:nth-child(6){height:100%}
.level-note{margin:10px 0 0;color:var(--muted);font-size:.9rem;min-height:1.6em}
.level-note b{color:var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.toggle{font:inherit;font-size:.85rem;background:none;border:1.5px solid var(--line);color:var(--muted);
  padding:5px 12px;border-radius:999px;cursor:pointer}
.hint{font-size:.85rem;color:var(--muted);margin:0 0 14px}
.hint mark{background:var(--mark);color:var(--mark-ink);padding:0 4px;border-radius:3px}
ol.phrases{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--line)}
.phrase{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:16px 2px;border-bottom:1.5px solid var(--line)}
.en{font-family:"Lexend",system-ui,sans-serif;font-size:1.12rem;line-height:1.5;font-weight:500}
.en mark{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:3px;font-weight:500}
.ja{grid-column:1/2;color:var(--muted);font-size:.88rem}
.sub{font-size:.85rem;font-weight:700;color:var(--accent);margin:0 0 6px}
.ask-h{margin-top:22px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;color:var(--accent);margin-bottom:2px}
.hide-ja .ja{display:none}
.say{grid-row:1/3;grid-column:2;align-self:center;width:44px;height:44px;border-radius:50%;
  border:1.5px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer;display:grid;place-items:center}
.say.playing{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.say svg{width:20px;height:20px}
.export{margin-top:28px}
.export-btn{font:inherit;font-weight:700;font-size:1rem;width:100%;padding:14px;border-radius:12px;border:none;
  background:var(--accent);color:var(--accent-ink);cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:center}
.export-btn svg{width:20px;height:20px}
.export-btn:disabled{opacity:.6;cursor:wait}
.export-note{font-size:.82rem;color:var(--muted);margin:8px 0 0;text-align:center;min-height:1.4em}
.foot{margin-top:10px;font-size:.82rem;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(10,20,35,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.open{display:flex}
.modal-box{background:var(--surface);border-radius:14px;padding:16px;max-width:480px;width:100%;max-height:90%;overflow:auto;text-align:center}
.modal-box img{width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.modal-box p{font-size:.9rem;margin:10px 0}
button:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v1.7.2 — Readability improvements */
:root{
  --bg:#F3F6FA;
  --surface:#FFFFFF;
  --ink:#14243A;
  --muted:#43546B;
  --line:#C6D1DF;
  --accent:#174F86;
  --accent-ink:#FFFFFF;
  --mark:#FFE36A;
  --mark-ink:#14243A;
  --step:#D5DFEB;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101B2A;--surface:#1B2B40;--ink:#F4F7FC;--muted:#C0CDDC;
    --line:#52657C;--accent:#8FC5F4;--accent-ink:#102033;
    --mark:#8A7414;--mark-ink:#FFF9DF;--step:#354B65;
  }
}
:root[data-theme="dark"]{
  --bg:#101B2A;--surface:#1B2B40;--ink:#F4F7FC;--muted:#C0CDDC;
  --line:#52657C;--accent:#8FC5F4;--accent-ink:#102033;
  --mark:#8A7414;--mark-ink:#FFF9DF;--step:#354B65;
}
body{font-size:17px;line-height:1.75}
.wrap{max-width:760px;padding:30px 22px 56px}
h1{font-size:clamp(2.3rem,6vw,3rem);margin-bottom:8px}
.lead{font-size:1rem;line-height:1.8;margin-bottom:30px}
section{margin-bottom:22px;padding:20px 22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 5px 18px rgba(25,45,75,.055)}
h2{font-size:1.08rem;line-height:1.5;margin-bottom:15px}
.chip{font-size:1rem;font-weight:500;padding:9px 15px;border-width:2px}
.chip[aria-pressed="true"]{font-weight:700}
.stairs{height:142px;gap:8px}
.stair{font-size:1.1rem;border:1px solid var(--line)}
.level-note{font-size:1rem;line-height:1.7}
.toggle{font-size:.95rem;font-weight:700;color:var(--ink);background:var(--surface);border-color:var(--line);padding:8px 14px}
.hint{font-size:.95rem;line-height:1.8;color:var(--ink);margin-bottom:18px}
.sub{font-size:1rem;line-height:1.6;color:var(--accent);margin:0 0 8px}
.ask-h{margin-top:26px}
ol.phrases{border-top:0;display:grid;gap:10px}
.phrase{padding:16px 15px;border:1px solid var(--line);border-radius:13px;background:var(--bg);gap:6px 14px}
.en{font-size:1.2rem;line-height:1.65;font-weight:600;letter-spacing:.005em}
.ja{font-size:1rem;line-height:1.7;color:var(--muted)}
.tag{font-size:.82rem}
.say{width:48px;height:48px;border-width:2px}
.export{background:transparent;border:0;box-shadow:none;padding:4px 0}
.export-btn{font-size:1.05rem;padding:16px;border-radius:14px}
.export-note,.foot{font-size:.92rem;line-height:1.7;color:var(--muted)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(max-width:600px){
 body{font-size:16px}
 .wrap{padding:22px 13px 40px}
 section{padding:17px 14px;border-radius:15px}
 .en{font-size:1.08rem}
 .ja{font-size:.96rem}
 .phrase{padding:14px 11px;gap:5px 8px}
 .say{width:44px;height:44px}
 .stairs{height:120px;gap:5px}
}

</style>
</head>
<body>
<main class="wrap">
  <h1>Talk Ready</h1>
  <p class="lead">テーマとレベルを選ぶと、最初の一言に使えるフレーズが出ます。</p>

  <section>
    <h2>① 何について話す？</h2>
    <div class="themes" id="themes" role="group" aria-label="テーマ"></div>
  </section>

  <section>
    <h2>② 自分のレベル(CEFR)</h2>
    <div class="stairs" id="stairs" role="group" aria-label="CEFRレベル"></div>
    <p class="level-note" id="levelNote"></p>
  </section>

  <section aria-live="polite">
    <div class="bar">
      <h2 id="resultTitle" style="margin:0"></h2>
      <button class="toggle" id="jaToggle" type="button">日本語訳を隠す</button>
    </div>
    <p class="hint"><mark>黄色の部分</mark>は自分の内容に入れ替えて話してみよう。発音ボタンで音声を確認できます。</p>
    <h3 class="sub">自分のことを話す</h3>
    <ol class="phrases" id="phrases"></ol>
    <h3 class="sub ask-h">相手に聞き返す</h3>
    <ol class="phrases" id="asks"></ol>
    <p class="foot" id="foot"></p>
  </section>

  <section class="export">
    <button class="export-btn" id="exportBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      画像として保存
    </button>
    <p class="export-note" id="exportNote">表示中のフレーズを1枚の画像(PNG)にします。</p>
  </section>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="画像プレビュー">
  <div class="modal-box">
    <img id="modalImg" alt="フレーズの画像">
    <p>画像を長押し(または右クリック)して保存してください。</p>
    <button class="toggle" id="modalClose" type="button">閉じる</button>
  </div>
</div>

B1:["I'm planning to [go hiking] if the weather is nice.|天気がよければ[ハイキングに行く]つもりです。","Last Sunday, I [stayed home and watched movies all day], which was really relaxing.|先週の日曜は[一日中家で映画を見ていて]、すごくリラックスできました。","I haven't decided yet, but I might [meet up with friends].|まだ決めてないけど、[友達と会う]かもしれません。","Would you like to join us?|一緒に来ませんか？"],
B2:["I've been meaning to [clean my room] for ages, so I'll probably do that this weekend.|ずっと[部屋の片付け]をしようと思っていたので、今週末たぶんやります。","Ideally, I'd spend the whole day [at a café reading], but I have [homework] to finish.|理想は一日中[カフェで読書]ですが、[宿題]を終わらせないといけません。","Last weekend turned out to be [more tiring] than I'd expected because [our match went into extra time].|[試合が延長戦になって]、先週末は思ったより[疲れ]ました。","How do you usually recharge after a busy week?|忙しい一週間のあと、どうやってリフレッシュしていますか？"],
C1:["I try not to overschedule my weekends; I've found [a bit of downtime] makes a real difference.|週末は予定を詰め込みすぎないようにしています。[少しの休息]が大きな違いを生むので。","If all goes to plan, I'll be [volunteering at a local event] on Saturday.|予定通りなら、土曜は[地域のイベントでボランティア]をしています。","Last weekend was a bit of a whirlwind — [we had three events in two days].|先週末はバタバタでした。[2日で3つも行事があって]。","Do you think weekends should be for rest or for getting things done?|週末は休むためのもの？それとも用事を片付けるためのもの？"],
C2:["Truth be told, my weekends tend to evaporate before I've [done half of what I intended].|正直なところ、週末は[やろうと思ったことの半分も終わらない]うちに消えてしまいます。","I've recently made a point of [switching off my phone] on Sundays, and it's been surprisingly liberating.|最近は日曜に[スマホの電源を切る]ようにしていて、意外なほど解放感があります。","Barring any last-minute changes, I'll be [heading to the mountains] with a few friends.|直前の変更がなければ、友達数人と[山へ行く]予定です。","How do you strike a balance between being productive and genuinely unwinding?|生産的に過ごすことと、本当にくつろぐことのバランスをどう取っていますか？"]},
travel:{
A1:["I want to go to [Hawaii].|[ハワイ]に行きたいです。","I went to [Okinawa].|[沖縄]に行きました。","It was [beautiful].|[きれい]でした。","Where do you want to go?|どこに行きたいですか？"],
A2:["I went to [Hokkaido] with my family last [summer].|去年の[夏]、家族で[北海道]に行きました。","We ate [delicious seafood] there.|そこで[おいしい海鮮]を食べました。","I'd like to visit [Australia] someday.|いつか[オーストラリア]に行ってみたいです。","Have you ever been to [Japan]?|[日本]に行ったことはありますか？"],
B1:["The best trip I've ever taken was to [Kyoto], because [the temples were amazing].|今までで一番の旅行は[京都]です。[お寺が素晴らしかった]からです。","If I could go anywhere, I'd go to [Canada] to [see the aurora].|どこでも行けるなら、[オーロラを見]に[カナダ]へ行きたいです。","When I travel, I always try to [eat local food].|旅行ではいつも[地元の料理を食べる]ようにしています。","What's the most memorable place you've visited?|今まで行った中で一番印象に残っている場所はどこですか？"],
B2:["What struck me most about [Taiwan] was [how friendly the people were].|[台湾]で一番印象的だったのは[人々の親切さ]でした。","I'd rather [explore on my own] than join a guided tour, since [it gives me more freedom].|ツアーより[一人で探検する]方が好きです。[自由がきく]ので。","Traveling abroad made me realize [how much I take for granted at home].|海外に行って、[普段どれだけ多くを当たり前に思っているか]に気づきました。","Do you prefer traveling to big cities or the countryside?|旅行するなら都会派？それとも田舎派？"],
C1:["Traveling to [Vietnam] completely changed my perception of [street food culture].|[ベトナム]への旅で[屋台文化]への見方ががらりと変わりました。","I'm increasingly drawn to [slow travel], where you spend longer in fewer places.|最近は、少ない場所に長く滞在する[スロートラベル]に惹かれています。","Language barriers can be frustrating, but they often lead to [the most memorable encounters].|言葉の壁はもどかしいけれど、[一番記憶に残る出会い]につながることも多いです。","How do you think tourism affects local communities?|観光は地域社会にどんな影響を与えると思いますか？"],
C2:["There's a world of difference between merely visiting a place and [genuinely immersing yourself in it].|ただ訪れることと[本当にその土地に浸ること]の間には大きな違いがあります。","Having [backpacked through Europe], I've become rather skeptical of [itineraries packed with landmarks].|[ヨーロッパをバックパックで回って]から、[名所だらけの旅程]には懐疑的になりました。","What lingers with me isn't the sights so much as [the conversations with strangers].|心に残るのは景色よりも、むしろ[見知らぬ人との会話]です。","Do you think travel broadens the mind, or is that something of a cliché?|旅は視野を広げると思いますか？それともそれは決まり文句にすぎない？"]},
food:{
A1:["I like [sushi].|[寿司]が好きです。","I eat [rice] for breakfast.|朝ごはんに[ごはん]を食べます。","It's [delicious].|[おいしい]です。","What food do you like?|何の食べ物が好きですか？"],
A2:["My favorite food is [ramen].|一番好きな食べ物は[ラーメン]です。","I often eat [curry] at home.|家でよく[カレー]を食べます。","I can't eat [natto].|[納豆]は食べられません。","Can you cook?|料理はできますか？"],
B1:["I've never tried [Indian food], but I'd like to.|[インド料理]は食べたことがないけど、食べてみたいです。","My mother makes the best [hamburg steak].|母の作る[ハンバーグ]が最高です。","I usually eat [a bento] because [it's cheaper].|[安い]ので、たいてい[弁当]を食べます。","What's a popular dish in your country?|あなたの国で人気の料理は何ですか？"],
B2:["I'm trying to [eat more vegetables], but it's harder than it sounds.|[野菜を多く食べ]ようとしていますが、思ったより難しいです。","If you visit [Osaka], you really should try [takoyaki].|[大阪]に行くなら、ぜひ[たこ焼き]を食べてみて。","What I love about [Japanese food] is [how seasonal it is].|[和食]の好きなところは[季節感がある]ところです。","Is there any food you just can't stand?|どうしても苦手な食べ物はありますか？"],
C1:["I've developed a real appreciation for [fermented foods] over the past year.|この一年で[発酵食品]の良さがわかってきました。","Food says a lot about a culture — [the way people share meals] is especially telling.|食は文化をよく表します。特に[食事の分け合い方]にそれが表れます。","I'm a bit torn about [fast food]; it's convenient, but [the health costs are real].|[ファストフード]には複雑な気持ちです。便利だけど[健康面の代償]がある。","How do you think eating habits will change in the future?|食習慣は将来どう変わると思いますか？"],
C2:["For me, [my grandmother's miso soup] is inextricably tied to [a sense of home].|私にとって[祖母の味噌汁]は[家の温もり]と切り離せません。","I'm wary of food trends that [prize appearance over flavor].|[味より見た目を重視する]食のトレンドには警戒しています。","There's an art to [a simple meal] that's easy to overlook.|[素朴な食事]には見過ごされがちな技があります。","Do you think food can ever truly be separated from its cultural context?|食べ物は文化的背景から本当に切り離せると思いますか？"]},
music:{
A1:["I like [J-pop].|[J-POP]が好きです。","I sing [every day].|[毎日]歌います。","My favorite singer is [name].|好きな歌手は[名前]です。","Do you like music?|音楽は好きですか？"],
A2:["I listen to music [on the train].|[電車で]音楽を聴きます。","I can play [the piano] a little.|[ピアノ]が少し弾けます。","I went to a [concert] last month.|先月[コンサート]に行きました。","What kind of music do you listen to?|どんな音楽を聴きますか？"],
B1:["I've been listening to [this band] a lot lately.|最近[このバンド]をよく聴いています。","Music helps me [concentrate when I study].|音楽は[勉強中に集中する]のに役立ちます。","I got into [K-pop] after [watching a music video].|[MVを見て]から[K-POP]にハマりました。","Who's your favorite artist right now?|今一番好きなアーティストは誰ですか？"],
B2:["What I love about [their songs] is [how honest the lyrics are].|[彼らの曲]の好きなところは[歌詞が正直な]ところです。","I tend to listen to [upbeat songs] when I need [a boost of energy].|[元気が欲しい]ときは[明るい曲]を聴きがちです。","If I could see any artist live, it would be [name].|誰のライブでも見られるなら[名前]です。","Is there a song that brings back special memories for you?|特別な思い出がよみがえる曲はありますか？"],
C1:["[This album] came out when [I was struggling], so it means a lot to me.|[このアルバム]は[私が悩んでいた]時期に出たので、特別な意味があります。","I've noticed my taste shifting from [mainstream pop] toward [indie music].|好みが[メジャーなポップ]から[インディー]へ移ってきました。","Streaming has made music more accessible, but arguably [less valued].|配信で音楽は身近になったけど、[価値は下がった]とも言えます。","Do you think music has the power to change society?|音楽に社会を変える力があると思いますか？"],
C2:["There's a rawness to [live performances] that no recording can quite capture.|[生演奏]には録音では捉えきれない生々しさがあります。","I find myself drawn to [songs that leave things unsaid].|[語りすぎない歌]に惹かれてしまいます。","Music was, in many ways, [my first language for emotions].|音楽はある意味、[感情を表す最初の言語]でした。","To what extent do you think our musical taste is shaped by the people around us?|音楽の好みは周りの人にどの程度影響されると思いますか？"]},

B2:["Without giving too much away, [the ending completely surprised me].|ネタバレしない程度に言うと、[結末に本当に驚きました]。","It's the kind of movie that [makes you think about your own life].|[自分の人生を考えさせられる]ような映画です。","I'd rather watch it [with subtitles] than [dubbed].|[吹き替え]より[字幕]で見る方がいいです。","What makes a movie worth watching twice?|2回見る価値のある映画って何が違うと思う？"],
C1:["What sets [this film] apart is [the way it handles silence].|[この映画]が際立っているのは[沈黙の使い方]です。","I was initially skeptical, but [the second half] won me over.|最初は懐疑的でしたが、[後半]で心をつかまれました。","It raises some uncomfortable questions about [social media].|[SNS]について居心地の悪い問いを投げかけてきます。","Do you think remakes ever live up to the original?|リメイクが原作を超えることはあると思いますか？"],
C2:["The film lingers precisely because [it refuses to offer easy answers].|[安易な答えを出さない]からこそ、この映画は心に残ります。","There's a restraint in [the director's style] that I find deeply compelling.|[監督の作風]にある抑制に強く惹かれます。","It's less a story about [war] than about [what people cling to].|[戦争]の話というより、[人が何にすがるか]の物語です。","Would you say films reflect society, or actively shape it?|映画は社会を映すもの？それとも積極的に形づくるもの？"]},
sports:{
A1:["I play [soccer].|[サッカー]をします。","I like [baseball].|[野球]が好きです。","I run [every morning].|[毎朝]走ります。","Do you play sports?|スポーツはしますか？"],
A2:["I'm on the [basketball] team.|[バスケ]部に入っています。","We practice [five days] a week.|週に[5日]練習します。","We won our game [last Sunday].|[先週の日曜]、試合に勝ちました。","What sports do you like to watch?|見るならどのスポーツが好きですか？"],
B1:["I've been playing [volleyball] since [junior high school].|[中学]から[バレー]をやっています。","My goal is to [win the regional tournament].|目標は[地区大会で優勝する]ことです。","Practice is tough, but [my teammates keep me going].|練習はきついけど、[仲間がいるから頑張れます]。","Which team do you support?|どのチームを応援していますか？"],
B2:["What I enjoy most about [tennis] is [the mental side of the game].|[テニス]で一番好きなのは[メンタル面の駆け引き]です。","If I hadn't [injured my knee], I might [still be playing].|[膝をけが]していなければ、[今も続けていた]かもしれません。","Watching [the World Cup] made me appreciate [how global the sport is].|[W杯]を見て[競技の世界的な広がり]を実感しました。","Do you think sports teach skills you can't learn in class?|スポーツには授業で学べない力があると思いますか？"],
C1:["[Losing in the final] taught me more than any victory ever has.|[決勝での敗北]は、どんな勝利よりも多くを教えてくれました。","There's been a lot of debate about [how much pressure young athletes face].|[若い選手が受けるプレッシャー]について多くの議論があります。","I've come to see [running] less as competition and more as [a way to clear my head].|[ランニング]を競争というより[頭を整理する手段]と思うようになりました。","Should schools put more emphasis on sports, or less?|学校はスポーツをもっと重視すべき？それとも減らすべき？"],
C2:["Sport, at its best, strips away [pretense] and reveals [character].|スポーツは最良の形では[見せかけ]をはぎ取り、[人柄]をあらわにします。","I'm uneasy about [how commercialized professional sports have become].|[プロスポーツの商業化]には不安を覚えます。","Few things rival [the silence before a penalty kick].|[PKの前の静寂]に匹敵するものはそうありません。","Is it possible to separate an athlete's achievements from their conduct off the field?|選手の功績とフィールド外の言動は切り離せると思いますか？"]},
family:{
A1:["I have [a brother].|[兄]がいます。","My mother is [kind].|母は[優しい]です。","There are [four] people in my family.|家族は[4]人です。","Do you have any brothers or sisters?|兄弟姉妹はいますか？"],
A2:["My father works at [a bank].|父は[銀行]で働いています。","My sister is [two] years older than me.|姉は私より[2]歳上です。","We often [eat dinner together].|よく[一緒に夕食を食べ]ます。","What does your family do on weekends?|あなたの家族は週末何をしますか？"],
B1:["I get along well with my [grandmother].|[祖母]とはとても仲がいいです。","My family always [goes camping] in summer.|私の家族は夏になると必ず[キャンプに行き]ます。","I sometimes argue with my [brother] about [the TV].|[テレビ]のことで時々[兄]とけんかします。","Who are you closest to in your family?|家族で一番仲がいいのは誰ですか？"],
B2:["My [father] has had a big influence on [the way I think about work].|[父]は[仕事に対する私の考え方]に大きな影響を与えました。","We're not the kind of family that [talks about feelings much].|うちは[あまり気持ちを話し合う]家族ではありません。","As I've gotten older, I've started to appreciate [my parents' hard work].|年を重ねるにつれ、[両親の苦労]がわかるようになりました。","How do family roles differ in your culture?|あなたの文化では家族の役割はどう違いますか？"],
C1:["Growing up [as the eldest], I often felt [responsible for my siblings].|[長子]として育ち、よく[弟妹への責任]を感じていました。","Our family dynamics shifted considerably when [my grandfather moved in].|[祖父が同居し始めて]から家族の関係がかなり変わりました。","I think [small daily rituals] hold families together more than [big events].|[大きなイベント]より[日々の小さな習慣]が家族をつなぐと思います。","Do you think the idea of family is changing in modern society?|現代社会で家族の概念は変わってきていると思いますか？"],
C2:["It's only in hindsight that I've understood [why my mother was so strict].|今になってようやく[母があれほど厳しかった理由]がわかりました。","Families are rarely as simple as they appear from the outside.|家族というものは外から見えるほど単純ではありません。","I've inherited [my grandfather's stubbornness], for better or worse.|良くも悪くも[祖父の頑固さ]を受け継いでいます。","How much do you think we're shaped by our families, as opposed to our own choices?|私たちは自分の選択よりも家族にどれほど形づくられていると思いますか？"]},
friends:{
A1:["This is my friend, [name].|友達の[名前]です。","She is [funny].|彼女は[おもしろい]です。","We play [games] together.|一緒に[ゲーム]をします。","Let's be friends!|友達になろう！"],

B2:["A good friend, in my opinion, is someone who [tells you the truth even when it hurts].|いい友達とは[耳の痛いことでも本当のことを言ってくれる]人だと思います。","We drifted apart for a while after [we went to different schools].|[別々の学校に進んで]から、しばらく疎遠になりました。","I'd rather have [a few close friends] than [lots of casual ones].|[浅い友達がたくさん]より[親しい友達が少し]の方がいいです。","Have you ever made a friend online?|ネットで友達ができたことはありますか？"],
C1:["Our friendship has survived [a lot of misunderstandings], which I think made it stronger.|私たちの友情は[多くの誤解]を乗り越え、それで強くなったと思います。","I've learned that friendship requires [effort], not just [shared interests].|友情には[共通の趣味]だけでなく[努力]が必要だと学びました。","Social media makes it easy to stay in touch, but arguably [harder to be close].|SNSで連絡は取りやすくなったけど、[親密になるのは難しくなった]とも言えます。","What do you think makes a friendship last?|友情が長続きする秘訣は何だと思いますか？"],
C2:["The friends who matter most are often [the ones who've seen you at your worst].|本当に大切な友達は、[最悪の自分を見てきた人]であることが多いです。","There's a quiet comfort in [being able to sit together without talking].|[黙って一緒にいられる]ことには静かな安心感があります。","I've come to accept that [some friendships belong to a certain time in life].|[人生のある時期だけの友情もある]と受け入れられるようになりました。","Is it possible for friendship to survive fundamentally different values?|根本的に価値観が違っても友情は成り立つと思いますか？"]},

C1:["My ambition is to [bridge the gap between technology and education].|私の目標は[テクノロジーと教育の橋渡し]をすることです。","I've realized that [the path matters as much as the destination].|[目的地と同じくらい過程も大切だ]と気づきました。","Rather than chasing [a stable job], I'd like to [pursue something meaningful].|[安定した仕事]を追うより[意義あること]を追求したいです。","How do you think AI will affect the jobs of the future?|AIは将来の仕事にどう影響すると思いますか？"],
C2:["I'm wary of defining myself too narrowly by [a single career].|[一つの職業]で自分を狭く定義することには慎重です。","If there's one thing I aspire to, it's [a life of continual learning].|目指すものがあるとすれば、[学び続ける人生]です。","The future I envision is less about [status] than about [contribution].|私の思い描く未来は[地位]より[貢献]が中心です。","Is it wiser to follow your passion or to cultivate it?|情熱に従うのと、情熱を育てるのとではどちらが賢明だと思いますか？"]},

C1:["It feels like [spring and autumn] are getting shorter every year.|[春と秋]が年々短くなっている気がします。","[Extreme heat] has become something we have to plan our lives around.|[猛暑]は生活を合わせて計画しなければならないものになりました。","There's something about [the first snow] that makes everything feel [new].|[初雪]には何もかもを[新しく]感じさせる何かがあります。","How has climate change affected the place where you live?|気候変動はあなたの住む地域にどんな影響を与えていますか？"],
C2:["The Japanese sensitivity to [seasonal change] runs deeper than most people realize.|日本人の[季節の移ろい]への感受性は、多くの人が思うより深いものです。","I've always found [the stillness after a storm] strangely reassuring.|[嵐の後の静けさ]には、なぜか安心させられます。","We treat the weather as small talk, yet [it quietly shapes how we live].|天気は雑談の話題なのに、[私たちの暮らし方を静かに形づくっています]。","Do you think modern life has distanced us from the rhythm of the seasons?|現代の生活は私たちを季節のリズムから遠ざけたと思いますか？"]},

C1:["I've come to see [rest] not as laziness but as [part of being productive].|[休息]を怠けではなく[生産性の一部]と考えるようになりました。","There's a lot of conflicting advice about [diet], which can be confusing.|[食事]については矛盾するアドバイスが多く、混乱します。","Small habits, like [walking instead of taking the bus], add up over time.|[バスでなく歩く]といった小さな習慣が積み重なります。","Should schools teach more about mental health?|学校は心の健康についてもっと教えるべきだと思いますか？"],

C1:["I have mixed feelings about [zoos]; they [protect species] but [limit animals' freedom].|[動物園]には複雑な思いがあります。[種を守る]けど[動物の自由を奪う]。","The bond between [people and pets] is often underestimated.|[人とペット]の絆は過小評価されがちです。","It's alarming how many species are [disappearing because of human activity].|[人間の活動によって消えつつある]種の多さには驚かされます。","Do you think animals should have legal rights?|動物に法的な権利を認めるべきだと思いますか？"],

C1:["AI is advancing so quickly that [it's hard to predict which jobs will remain].|AIの進歩が速すぎて、[どの仕事が残るか予測しにくい]です。","I'm concerned about [how much personal data we give away without thinking].|[何も考えずにどれほど個人情報を差し出しているか]が心配です。","Technology itself is neutral; what matters is [how we choose to use it].|技術そのものは中立で、大切なのは[どう使うか]です。","How do you think AI will change the way we learn?|AIは学び方をどう変えると思いますか？"],

environment:{

B2:["Individual actions matter, but [companies and governments] need to [do much more].|個人の行動も大切ですが、[企業や政府]が[もっと多くのことをする]必要があります。","I was shocked to learn that [so much food is wasted in Japan].|[日本でこんなに食品が廃棄されている]と知って衝撃を受けました。","If everyone [took public transport], it would make a big difference.|みんなが[公共交通機関を使え]ば、大きな違いが生まれるでしょう。","Do you think young people care more about the environment than older generations?|若い世代は上の世代より環境に関心があると思いますか？"],
C1:["There's often a tension between [economic growth] and [environmental protection].|[経済成長]と[環境保護]の間にはしばしば緊張関係があります。","I'm cautiously optimistic about [renewable energy], though [progress is slow].|[再生可能エネルギー]には慎重ながら楽観的ですが、[進みは遅い]です。","Climate change affects [poorer countries] disproportionately, which raises questions of fairness.|気候変動は[貧しい国]に不均衡に影響し、公平性の問題を提起します。","What role should schools play in environmental education?|環境教育において学校はどんな役割を果たすべきだと思いますか？"],

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let theme=store.get("tr-theme")||"intro";
let level=store.get("tr-level")||"A2";
if(!P[theme])theme="intro";
if(!LEVELS.find(l=>l.id===level))level="A2";
let hideJa=store.get("tr-hideja")==="1";

const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const markup=s=>esc(s).replace(/\[([^\]]+)\]/g,"<mark>$1</mark>");
const plain=s=>s.replace(/\[([^\]]+)\]/g,"$1");
const split=s=>{const [en,ja]=s.split("|");return {en,ja}};
const says=()=>P[theme][level].slice(0,3).map(split);
const asks=()=>[P[theme][level][3],...Q[theme][level]].map(split);
const cur=()=>[...says(),...asks()];
const speaker='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

function renderControls(){
  $("themes").innerHTML=THEMES.map(t=>`<button class="chip" type="button" data-t="${t.id}" aria-pressed="${t.id===theme}">${t.ja}</button>`).join("");
  $("stairs").innerHTML=LEVELS.map(l=>`<button class="stair" type="button" data-l="${l.id}" aria-pressed="${l.id===level}" aria-label="${l.id} ${l.ja}">${l.id}</button>`).join("");
  const L=LEVELS.find(l=>l.id===level);
  $("levelNote").innerHTML=`<b>${L.id} ${L.ja}</b>:${L.desc}`;
}
function renderPhrases(){
  const t=THEMES.find(x=>x.id===theme);
  $("resultTitle").textContent=`${t.ja} × ${level}`;
  const item=(p,i)=>`<li class="phrase">
      <span class="en" lang="en">${markup(p.en)}</span>
      <button class="say" type="button" data-i="${i}" aria-label="発音を聞く">${speaker}</button>
      <div class="ja">${esc(plain(p.ja))}</div>
    </li>`;
  const s=says(), a=asks();
  $("phrases").innerHTML=s.map((p,i)=>item(p,i)).join("");
  $("asks").innerHTML=a.map((p,i)=>item(p,i+s.length)).join("");
  document.body.classList.toggle("hide-ja",hideJa);
  $("jaToggle").textContent=hideJa?"日本語訳を表示":"日本語訳を隠す";
  $("exportNote").textContent=hideJa?"表示中のフレーズを画像(PNG)にします(日本語訳なし)。":"表示中のフレーズを画像(PNG)にします。";
}
function render(){renderControls();renderPhrases()}

/* 読み上げ */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang))}catch(e){}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
else $("foot").textContent="このブラウザでは読み上げ機能が使えません。";
function speak(i,btn){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  document.querySelectorAll(".say.playing").forEach(b=>b.classList.remove("playing"));
  const u=new SpeechSynthesisUtterance(plain(cur()[i].en));
  u.lang="en-US";
  const v=voices.find(v=>v.lang.replace("_","-")==="en-US")||voices[0];
  if(v)u.voice=v;
  u.rate=LEVELS.find(l=>l.id===level).rate;
  btn.classList.add("playing");
  u.onend=u.onerror=()=>btn.classList.remove("playing");
  speechSynthesis.speak(u);
}

/* 画像エクスポート */
const EN_FONT='"Lexend", "Helvetica Neue", Arial, sans-serif';
const JA_FONT='"M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif';
function enTokens(s){
  const out=[];
  s.split(/(\[[^\]]+\])/).forEach(seg=>{
    if(!seg)return;
    const m=seg.startsWith("[");
    const txt=m?seg.slice(1,-1):seg;
    txt.split(/(\s+)/).forEach(w=>{if(w)out.push({t:w,m,sp:/^\s+$/.test(w)})});
  });
  return out;
}
function wrapEn(ctx,s,maxW){
  const lines=[[]];let w=0;
  for(const tk of enTokens(s)){
    const tw=ctx.measureText(tk.t).width;
    if(tk.sp){ if(w>0){lines[lines.length-1].push({...tk,w:tw});w+=tw;} continue; }
    if(w+tw>maxW&&w>0){
      const L=lines[lines.length-1];
      while(L.length&&L[L.length-1].sp)L.pop();
      lines.push([]);w=0;
    }
    lines[lines.length-1].push({...tk,w:tw});w+=tw;
  }
  return lines;
}
function wrapJa(ctx,s,maxW){
  const lines=[];let line="";
  for(const ch of s){
    if(ctx.measureText(line+ch).width>maxW&&line){lines.push(line);line=ch;}
    else line+=ch;
  }
  if(line)lines.push(line);
  return lines;
}
async function buildImage(){
  try{await Promise.all([document.fonts.load('500 44px "Lexend"'),document.fonts.load('700 64px "Lexend"'),document.fonts.load('400 30px "M PLUS Rounded 1c"'),document.fonts.load('700 30px "M PLUS Rounded 1c"')]);}catch(e){}
  const W=1080,PAD=80,CW=W-PAD*2;
  const C={bg:"#F7F9FB",ink:"#16283F",muted:"#5B6B80",line:"#DCE3EC",accent:"#1F4E79",mark:"#FFE066"};
  const t=THEMES.find(x=>x.id===theme), L=LEVELS.find(l=>l.id===level), list=cur();
  const cv=document.createElement("canvas"), ctx=cv.getContext("2d");
  const EN_SIZE=44, EN_LH=64, JA_SIZE=30, JA_LH=46, TAG_SIZE=26;
  // レイアウト計算
  const blocks=list.map((p,i)=>{
    ctx.font=`500 ${EN_SIZE}px ${EN_FONT}`;
    const en=wrapEn(ctx,p.en,CW);
    ctx.font=`400 ${JA_SIZE}px ${JA_FONT}`;
    const ja=hideJa?[]:wrapJa(ctx,plain(p.ja),CW);
    const ask=i===0||i===3;
    const h=40+(ask?TAG_SIZE+14:0)+en.length*EN_LH+(ja.length?12+ja.length*JA_LH:0)+40;
    return {en,ja,ask,h,label:i===0?"自分のことを話す":"相手に聞き返す"};
  });
  const HEADER=250, FOOTER=120;
  const H=HEADER+blocks.reduce((a,b)=>a+b.h,0)+FOOTER;
  cv.width=W;cv.height=H;
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  ctx.textBaseline="alphabetic";
  // ヘッダー
  ctx.fillStyle=C.ink;ctx.font=`700 72px ${EN_FONT}`;ctx.fillText("Talk Ready",PAD,PAD+60);
  ctx.font=`700 34px ${JA_FONT}`;ctx.fillStyle=C.accent;
  ctx.fillText(`${t.ja}  ×  ${L.id} ${L.ja}`,PAD,PAD+128);
  let y=HEADER;
  ctx.strokeStyle=C.line;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(PAD,y);ctx.lineTo(W-PAD,y);ctx.stroke();
  for(const b of blocks){
    let yy=y+40;
    if(b.ask){ctx.font=`700 ${TAG_SIZE}px ${JA_FONT}`;ctx.fillStyle=C.accent;ctx.fillText(b.label,PAD,yy+TAG_SIZE-4);yy+=TAG_SIZE+14;}
    ctx.font=`500 ${EN_SIZE}px ${EN_FONT}`;
    for(const line of b.en){
      const base=yy+EN_SIZE;
      let x=PAD;
      line.forEach((tk,k)=>{
        const prev=line[k-1], next=line[k+1];
        const hl=tk.m&&(!tk.sp||(prev&&prev.m&&next&&next.m));
        if(hl){ctx.fillStyle=C.mark;const pad=tk.sp?0:4;ctx.fillRect(x-pad,base-EN_SIZE+2,tk.w+pad*2,EN_SIZE+14);}
        x+=tk.w;
      });
      x=PAD;ctx.fillStyle=C.ink;
      line.forEach(tk=>{if(!tk.sp)ctx.fillText(tk.t,x,base);x+=tk.w;});
      yy+=EN_LH;
    }
    if(b.ja.length){
      yy+=12;ctx.font=`400 ${JA_SIZE}px ${JA_FONT}`;ctx.fillStyle=C.muted;
      for(const l of b.ja){ctx.fillText(l,PAD,yy+JA_SIZE);yy+=JA_LH;}
    }
    y+=b.h;
    ctx.strokeStyle=C.line;ctx.beginPath();ctx.moveTo(PAD,y);ctx.lineTo(W-PAD,y);ctx.stroke();
  }
  ctx.font=`400 26px ${JA_FONT}`;ctx.fillStyle=C.muted;
  ctx.fillText("黄色の部分を自分の内容に入れ替えて話してみよう",PAD,H-PAD+20);
  return cv;
}
const downloadsP=Promise.resolve(null);
async function exportImage(){
  const btn=$("exportBtn");btn.disabled=true;
  const note=$("exportNote");const orig=note.textContent;note.textContent="画像を作成中…";
  try{
    const cv=await buildImage();
    const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
    const filename=`TalkReady_${theme}_${level}.png`;
    const dl=await downloadsP;
    if(dl&&blob){
      try{await dl.save({filename,data:blob});note.textContent="保存しました。";setTimeout(()=>note.textContent=orig,2500);return;}
      catch(err){
        if(err&&err.code==="declined"){note.textContent=orig;return;}
        if(err&&err.code==="rate_limited"){note.textContent="少し待ってからもう一度お試しください。";return;}
      }
    }
    $("modalImg").src=cv.toDataURL("image/png");
    $("modal").classList.add("open");
    note.textContent=orig;
  }catch(e){
    note.textContent="画像を作成できませんでした。もう一度お試しください。";
  }finally{btn.disabled=false;}
}

document.addEventListener("click",e=>{
  const c=e.target.closest(".chip");
  if(c){theme=c.dataset.t;store.set("tr-theme",theme);return render()}
  const s=e.target.closest(".stair");
  if(s){level=s.dataset.l;store.set("tr-level",level);return render()}
  const b=e.target.closest(".say");
  if(b)return speak(+b.dataset.i,b);
  if(e.target.closest("#jaToggle")){hideJa=!hideJa;store.set("tr-hideja",hideJa?"1":"0");return renderPhrases()}
  if(e.target.closest("#exportBtn"))return exportImage();
  if(e.target.closest("#modalClose")||e.target.id==="modal")$("modal").classList.remove("open");
});
render();
</script>
